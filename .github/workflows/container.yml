name: 'CD -> Container'
on:
    workflow_dispatch:
    push:
        branches:
            - stable

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build:
        name: 'Build container image'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
            packages: write

        env:
            REGISTRY: ghcr.io
            IMAGE_NAME: ${{ github.repository }}

        steps:
            - name: 'Checkout'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: 'Setup tags'
              id: setup-tags
              run: |
                  TIMESTAMP="$(date +%Y.%m.%d)"
                  SHA_SHORT="${GITHUB_SHA::7}"

                  TAGS=()
                  TAGS+=("latest")
                  TAGS+=("${GITHUB_SHA}")
                  TAGS+=("${TIMESTAMP}-${SHA_SHORT}")

                  echo "build-tags=${TAGS[*]}" >> $GITHUB_OUTPUT

            - name: 'Build image'
              id: build-image
              uses: redhat-actions/buildah-build@5d8479758cc72ed82df28daba521d27e20ff8c8a # master
              with:
                  archs: amd64
                  containerfiles: Dockerfile
                  image: ${{ env.IMAGE_NAME }}
                  layers: true
                  tags: ${{ steps.setup-tags.outputs.build-tags }}
                  context: .

            - name: 'Push to GHCR'
              uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
              env:
                  REGISTRY_USER: ${{ github.actor }}
                  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

              with:
                  image: ${{ steps.build-image.outputs.image }}
                  tags: ${{ steps.build-image.outputs.tags }}
                  registry: ${{ env.REGISTRY }}
                  username: ${{ env.REGISTRY_USER }}
                  password: ${{ env.REGISTRY_PASSWORD }}
